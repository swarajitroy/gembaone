version: '3.8'

services:
  database:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=gembaone
      - POSTGRES_USER=gembaone
      - POSTGRES_PASSWORD=gembaone_dev_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gembaone"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PIP_TARGET: ".[postgres]"
    environment:
      - DATABASE_URL=postgresql+psycopg://gembaone:gembaone_dev_pass@database:5432/gembaone
      - CORS_ORIGINS=http://localhost
      - SECRET_KEY=dev-secret-key-change-in-production
      - ENVIRONMENT=development
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "9000:9000"
    x-preview-port: 9000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
